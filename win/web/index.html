<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>闪电全能下载</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M13.5 2 4 14h6l-1.5 8L20 9h-6.5l1-7z" fill="currentColor"/>
    </svg>
    <div>
      <h1 data-i18n="app.name">闪电全能下载</h1>
      <p class="sub" data-i18n="app.sub">磁力 · 种子 · ed2k · 直链 · 网盘 · 视频站</p>
    </div>
  </div>
  <div class="status">
    <span id="engine-dot" class="dot"></span>
    <span id="engine-text">内核连接中…</span>
    <span id="gw-badge" class="badge alt" title="浏览器扩展接口">扩展 :6800</span>
    <button id="settings-btn" class="ghost icon" title="设置">⚙</button>
  </div>
</header>

<div id="clip" class="clip hidden">
  <span id="clip-text"></span>
  <button id="clip-add" class="primary sm">添加</button>
  <button id="clip-close" class="ghost sm">忽略</button>
</div>

<section class="adder">
  <input id="url" type="text" spellcheck="false"
         placeholder="粘贴链接后回车：magnet: / .torrent / ed2k / HTTP 直链 / YouTube、B 站、抖音、小红书页面">
  <button id="add-btn" class="primary">添加</button>
</section>
<p class="hint" id="hint"></p>

<nav class="tabs">
  <button class="tab active" data-tab="all">全部</button>
  <button class="tab" data-tab="active">进行中</button>
  <button class="tab" data-tab="done">已完成</button>
  <button class="tab" data-tab="error">失败</button>
  <button class="tab" data-tab="recycle">回收站</button>
</nav>

<main id="list" class="list"></main>
<p id="empty" class="empty">还没有任务。复制一个链接粘到上面试试。</p>

<aside id="panel" class="panel">
  <div class="panel-head">
    <h2>设置</h2>
    <button id="panel-close" class="ghost icon">×</button>
  </div>
  <div class="panel-body">
    <section class="group">
      <h3>下载</h3>
      <label class="row"><span>同时下载</span>
        <select id="max_running">
          <option value="1">1 个任务</option><option value="2">2 个任务</option>
          <option value="3">3 个任务</option><option value="5">5 个任务</option>
          <option value="8">8 个任务</option><option value="10">10 个任务</option>
        </select>
      </label>
      <label class="row"><span>下载限速</span>
        <select id="limit_kb">
          <option value="0">不限速</option><option value="256">256 KB/s</option>
          <option value="512">512 KB/s</option><option value="1024">1 MB/s</option>
          <option value="2048">2 MB/s</option><option value="5120">5 MB/s</option>
        </select>
      </label>
      <label class="row"><span>视频分片并发</span>
        <input id="concurrency" type="number" min="1" max="16">
      </label>
      <label class="row"><span>Cookie 来源</span>
        <select id="cookies_from_browser">
          <option value="">不读取</option><option value="chrome">Chrome</option>
          <option value="edge">Edge</option><option value="firefox">Firefox</option>
        </select>
      </label>
    </section>

    <section class="group">
      <h3>保存位置</h3>
      <label class="row"><span>磁力、种子</span><input id="dir_movie" type="text"></label>
      <label class="row"><span>视频网站</span><input id="dir_video" type="text"></label>
      <label class="row"><span>其他文件</span><input id="dir_other" type="text"></label>
      <label class="row"><span>记住上次位置</span><input id="remember_dir" type="checkbox"></label>
    </section>

    <section class="group">
      <h3>行为</h3>
      <label class="row"><span>复制链接后弹出提示</span><input id="watch_clipboard" type="checkbox"></label>
      <label class="row"><span>新建任务显示确认框</span><input id="confirm_new" type="checkbox"></label>
      <label class="row"><span>下载完成时通知</span><input id="notify" type="checkbox"></label>
      <label class="row"><span>下载完成时提示音</span><input id="done_sound" type="checkbox"></label>
      <label class="row"><span>下载时阻止系统睡眠</span><input id="prevent_sleep" type="checkbox"></label>
      <label class="row"><span>开机自动启动</span><input id="launch_at_login" type="checkbox"></label>
      <label class="row"><span>自动检查更新</span><input id="auto_update_check" type="checkbox"></label>
    </section>

    <section class="group">
      <h3>定时下载</h3>
      <label class="row"><span>只在指定时段下载</span><input id="schedule_on" type="checkbox"></label>
      <label class="row"><span>开始（时）</span><input id="schedule_from" type="number" min="0" max="23"></label>
      <label class="row"><span>结束（时）</span><input id="schedule_to" type="number" min="0" max="23"></label>
      <p class="note">时段外自动暂停，到点自动继续。手动继续的任务不会被再次暂停。</p>
    </section>

    <section class="group">
      <h3>其他</h3>
      <label class="row"><span>语言</span>
        <select id="language"><option value="zh">简体中文</option><option value="en">English</option></select>
      </label>
      <div class="row"><span>浏览器扩展</span><button id="gw-info" class="ghost sm">查看接口</button></div>
      <div class="row"><span>诊断</span><button id="diag-btn" class="ghost sm">导出诊断信息</button></div>
      <div class="row"><span>更新</span><button id="update-btn" class="ghost sm">检查更新</button></div>
      <div class="row"><span>ffmpeg</span><button id="ffmpeg-btn" class="ghost sm">安装 / 检查</button></div>
    </section>
    <p class="ver" id="ver"></p>
  </div>
</aside>

<div id="files" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="files-title">选择要下载的文件</h3>
      <button id="files-close" class="ghost icon">×</button>
    </div>
    <div class="modal-body">
      <label class="row"><input id="files-all" type="checkbox" checked><span>全选</span></label>
      <div id="files-list" class="files-list"></div>
    </div>
    <div class="modal-foot">
      <span id="files-sum" class="note"></span>
      <button id="files-ok" class="primary">开始下载</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
